    <style>
        .award-item {
            background: var(--white);
            border-radius: 12px;
            padding: 0.65rem 1rem;
            margin-bottom: 0.55rem;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
        }
        
        .award-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.05) 0%, rgba(0, 123, 255, 0.02) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .award-item:hover::before {
            opacity: 1;
        }
        
        .award-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        
        .award-category {
            display: inline-block;
            padding: 0.2rem 0.65rem;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .award-title {
            color: var(--dark);
            font-weight: 600;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.3;
        }
        
        .award-title-sep {
            color: var(--secondary-color);
            opacity: 0.45;
            font-size: 0.9rem;
            line-height: 1;
            margin: 0 -0.15rem;
        }
        
        .award-meta {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin: 0;
        }
        
        .award-organization {
            color: var(--primary-color);
            font-weight: 500;
            margin: 0;
            font-size: 0.85rem;
        }
        
        .award-meta-sep {
            color: var(--secondary-color);
            opacity: 0.5;
            font-size: 0.85rem;
            line-height: 1;
        }
        
        .award-date {
            color: var(--secondary-color);
            font-weight: 500;
            margin: 0;
            white-space: nowrap;
            font-size: 0.85rem;
        }
        
        .category-academic {
            background-color: #e3f2fd;
            color: #1976d2;
        }
        
        .category-scholarship {
            background-color: #f3e5f5;
            color: #7b1fa2;
        }
        
        .category-competition {
            background-color: #fff3e0;
            color: #f57c00;
        }
        
        .category-honor {
            background-color: #e8f5e8;
            color: #388e3c;
        }
        
        .award-stats {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-item {
            text-align: center;
            padding: 1rem;
        }
        
        .stat-item h3 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .stat-item p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .award-timeline {
            position: relative;
        }
        
        .filter-buttons {
            margin-bottom: 2rem;
        }
        
        .filter-btn {
            margin: 0.25rem;
            border-radius: 25px;
            padding: 0.5rem 1.5rem;
        }
        
        .filter-btn.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>

    <script src="script.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function loadAllAwards() {
                const awardTimeline = document.querySelector('.award-timeline');
                if (!awardTimeline || !academicData || !academicData.awards) return;

                const sortedAwards = academicData.awards.slice().sort((a, b) => b.year - a.year);

                let html = '';
                sortedAwards.forEach(award => {
                    html += `
                        <div class="award-item" data-category="${award.category}">
                            <span class="award-category category-${award.category}">${award.categoryLabel}</span>
                            <h3 class="award-title">${award.title}</h3>
                            <span class="award-title-sep">—</span>
                            <div class="award-meta">
                                <span class="award-organization">${award.organization}</span>
                                <span class="award-meta-sep">·</span>
                                <span class="award-date">${award.date}</span>
                            </div>
                        </div>
                    `;
                });

                awardTimeline.innerHTML = html;

                initializeFiltering();
            }

            function initializeFiltering() {
                const filterButtons = document.querySelectorAll('.filter-btn');
                const awards = document.querySelectorAll('.award-item');

                filterButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        filterButtons.forEach(btn => btn.classList.remove('active'));
                        this.classList.add('active');

                        const filter = this.getAttribute('data-filter');

                        awards.forEach(award => {
                            if (filter === 'all' || award.getAttribute('data-category') === filter) {
                                award.style.display = 'block';
                                award.style.animation = 'fadeIn 0.5s ease-in';
                            } else {
                                award.style.display = 'none';
                            }
                        });
                    });
                });
            }

            loadAllAwards();
        });
        
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
